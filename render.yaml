services:
  # Backend: FastAPI service using Docker
  - type: web
    name: ledgerflow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BACKEND_URL
        sync: false

  # Frontend: React static site served via Render
  - type: web
    name: ledgerflow-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    publishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: ledgerflow-backend
          type: web
          property: host
      - key: BACKEND_URL
        fromService:
          name: ledgerflow-backend
          type: web
          property: host

# Database service (PostgreSQL) - This must be completely separated from the services list
databases:
  - name: ledgerflow-db
    plan: free

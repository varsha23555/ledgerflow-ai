services:
  # Backend: FastAPI service using Docker
  - type: web
    name: ledgerflow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    # Set the port from environment variable (Render sets PORT automatically)
    # The Dockerfile already defaults to 8000 and respects PORT env var
    healthCheckPath: /health
    envVars:
      # Production environment variables - these should be set in the Render dashboard
      # or via a .env file in the repository
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BACKEND_URL
        sync: false
    # Auto-deploy on push
    autoDeploy: true

  # Frontend: React static site served via Render
  - type: web
    name: ledgerflow-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    # Set the port Render expects for static sites
    # Render sets PORT env var automatically for static sites
    envVars:
      # Public URL of the backend service, derived from its Render hostname
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: ledgerflow-backend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: BACKEND_URL
        fromService:
          name: ledgerflow-backend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    # Auto-deploy on push
    autoDeploy: true

# Database service (PostgreSQL)
databases:
  - name: ledgerflow-db
    plan: free